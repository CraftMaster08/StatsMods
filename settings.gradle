pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
        maven { name = 'NeoForged'; url = 'https://maven.neoforged.net/releases' }
        maven { name = 'MinecraftForge'; url = 'https://maven.minecraftforge.net/' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'StatsMods'

// Every mod is split into a shared 'common' module plus one module per loader.
def mods = ['cm08statscore', 'statpeek', 'playtimeleaderboard', 'distanceleaderboard', 'deathleaderboard', 'killleaderboard']
def loaders = ['common', 'fabric', 'forge', 'neoforge']

mods.each { mod ->
    loaders.each { loader ->
        include ":${mod}:${loader}"
        project(":${mod}:${loader}").projectDir = file("${mod}/${loader}")
    }
}
