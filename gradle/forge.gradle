// Shared configuration for every '<mod>/forge' submodule.
// Applied from each submodule's build.gradle via: apply from: rootProject.file('gradle/forge.gradle')

def modProps = new Properties()
new File(project.projectDir.parentFile, 'mod.properties').withInputStream { modProps.load(it) }
modProps.each { k, v -> project.ext[k] = v }

def extraCommonDeps = project.hasProperty('extra_common_dependencies')
        ? extra_common_dependencies.split(',').collect { it.trim() }
        : []

base {
    archivesName = "${mod_id}-forge"
}
group = "${mod_group_id}.${mod_id}"
// The +<mc version> suffix only affects the jar filename/reported build version (matches the
// convention Fabric API itself uses, e.g. 0.116.13+1.21.1) -- the mod's own declared version in
// mods.toml stays the plain mod_version.
version = "${mod_version}+${minecraft_version}"

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
        }
        register('client')
        register('server') { args '--nogui' }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation project(":${mod_id}:common")
}

// NOTE: extraCommonDeps mods (e.g. cm08statscore) are intentionally NOT auto-loaded into this
// mod's own runClient. Forge's dev-mode mod file scanner treats a cross-project classes-dir and
// resources-dir as two disconnected "mod file" candidates when added directly to the classpath
// (unlike NeoForge's ModDevGradle, which has an explicit, supported mechanism for this), producing
// unreliable "has mods that were not found" failures -- for the SAME reason, this module doesn't
// use the compileOnly-plus-manual-runtimeClasspath trick for its own :common either, since that
// alone was enough to confuse Forge's scanner about this mod's own files too. A plain
// `implementation` dependency (above) is safe here precisely because Forge is never asked to
// cross-project-load another mod's classes via extraCommonDeps, so there's no risk of the
// duplicate-package conflict that trick exists to avoid elsewhere (see fabric.gradle/
// neoforge.gradle). This module's own common classes are still reachable at runtime, so
// PlatformHelper.isModLoaded(...) checks work correctly and an addon just gracefully soft-disables
// itself if cm08statscore isn't present, exactly as it would with cm08statscore genuinely absent.
// To test the whole pack together, build all jars and install them in a real instance -- see the
// README's "Building & running" section.

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_id                  : mod_id, mod_name: mod_name, mod_version: mod_version,
            mod_description         : mod_description, mod_authors: mod_authors, mod_license: mod_license,
            minecraft_version_range : minecraft_version_range,
            loader_version_range    : forge_loader_version_range,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// Bundle this mod's own common module classes into the mod jar so it's a self-contained,
// runnable mod (the common module itself has no mods.toml and isn't a valid mod on its own).
// Does NOT bundle other mods' common modules (e.g. cm08statscore) pulled in via
// extraCommonDependencies -- those stay separate runtime dependencies, provided by that mod's
// own jar, to avoid duplicate-class conflicts when both are installed.
tasks.named('jar', Jar).configure {
    from(project(":${mod_id}:common").sourceSets.main.output)
    manifest {
        attributes([
                'Specification-Title'  : mod_id,
                'Specification-Vendor' : mod_authors,
                'Specification-Version': '1',
                'Implementation-Title' : mod_name,
                'Implementation-Version': mod_version,
                'Implementation-Vendor': mod_authors,
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
